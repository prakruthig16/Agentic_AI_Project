
{% extends 'base.html' %}

{% block content %}

<h3>Conversation History</h3>
<p class="text-secondary">Your saved AI conversations.</p>

<div class="row g-3">

    {% for session in sessions %}

    <div class="col-md-6">

        <div class="feature-card">

            <h5>
                <i class="bi bi-chat-left-text"></i>
                {{ session.title }}
            </h5>

            <p>{{ session.created_at }}</p>

            <a href="/chat/?session={{ session.id }}"
               class="btn btn-outline-primary btn-sm">
                Open Conversation
            </a>

        </div>

    </div>

    {% empty %}

    <div class="col-12">
        <div class="alert alert-info">
            No conversations available.
        </div>
    </div>

    {% endfor %}

</div>

{% endblock %}
