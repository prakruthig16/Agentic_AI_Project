
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>AI Teaching Assistant</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>

<body data-session-id="{{ selected_session_id|default:'' }}">

<div class="app-wrapper">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="brand">
            <i class="bi bi-robot"></i>
            <span>AI Assistant</span>
        </div>

        <div class="sidebar-menu">

            <a href="/" class="menu-item">
                <i class="bi bi-grid"></i>
                Dashboard
            </a>

            <a href="/chat/" class="menu-item">
                <i class="bi bi-chat-dots"></i>
                AI Chat
            </a>

            <a href="/history/" class="menu-item">
                <i class="bi bi-clock-history"></i>
                History
            </a>

        </div>

        <div class="sidebar-footer">
            <span class="status-dot"></span>
            Ollama Local AI
        </div>

    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <header class="topbar">
            <h5>Agentic AI Teaching Assistant</h5>
            <span class="badge bg-success">Local AI</span>
        </header>

        <section class="page-content">
            {% block content %}
            {% endblock %}
        </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
